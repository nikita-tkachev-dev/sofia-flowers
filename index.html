<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>♡</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    // Сколько цветов растёт (подстроится под ширину экрана, это верхняя граница).
    const MAX_FLOWERS = 60;
    // За сколько мс вырастает один стебель.
    const GROW_MS = 1800;
    // За сколько мс раскрывается бутон после того как стебель дорос.
    const BLOOM_MS = 700;
    // Общее время, за которое стартуют все цветы (растягиваем старты по полю).
    const FIELD_SPAN_MS = 2200;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let w, h, dpr, flowers = [];
    let startTime = null;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeOutBack(t) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    const PALETTES = [
      { petal: "#e75480", center: "#f7d774", type: "rose" },
      { petal: "#f2a6c6", center: "#fff3b0", type: "rose" },
      { petal: "#ffd23f", center: "#7a4a1e", type: "sunflower" },
      { petal: "#fdfdfd", center: "#f5c518", type: "daisy" },
      { petal: "#f7c59f", center: "#a24936", type: "rose" },
    ];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeFlowers();
    }

    function makeFlowers() {
      flowers = [];
      const count = Math.min(MAX_FLOWERS, Math.max(24, Math.floor(w / 22)));
      const groundY = h * 0.92;

      for (let i = 0; i < count; i++) {
        const x = (w / count) * (i + 0.5) + (Math.random() - 0.5) * (w / count) * 0.7;
        const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];

        flowers.push({
          x,
          groundY,
          stemHeight: h * (0.16 + Math.random() * 0.22),
          headSize: (pal.type === "sunflower" ? 10 : 7) + Math.random() * 5,
          petalCount: pal.type === "sunflower" ? 14 : (pal.type === "daisy" ? 10 : 9),
          palette: pal,
          delay: Math.random() * FIELD_SPAN_MS,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.5 + Math.random() * 0.4,
          swayAmp: 4 + Math.random() * 5,
          tilt: (Math.random() - 0.5) * 0.15
        });
      }
      flowers.sort((a, b) => a.x - b.x);
    }

    function drawStem(f, growProgress, topX, topY) {
      ctx.strokeStyle = "rgba(90, 160, 80, 0.9)";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(f.x, f.groundY);
      // Лёгкий изгиб стебля через квадратичную кривую.
      const midX = f.x + (topX - f.x) * 0.5 + Math.sin(growProgress * Math.PI) * 3;
      const midY = f.groundY - (f.groundY - topY) * 0.5;
      ctx.quadraticCurveTo(midX, midY, topX, topY);
      ctx.stroke();

      // Пара листиков на стебле, если стебель дорос хотя бы наполовину.
      if (growProgress > 0.45) {
        const leafY = f.groundY - (f.groundY - topY) * 0.4;
        const leafAlpha = Math.min(1, (growProgress - 0.45) / 0.25);
        ctx.fillStyle = `rgba(90, 160, 80, ${0.8 * leafAlpha})`;
        ctx.save();
        ctx.translate(f.x, leafY);
        ctx.rotate(-0.5);
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.translate(f.x, leafY + 10);
        ctx.rotate(0.5);
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawHead(f, bloom, cx, cy) {
      if (bloom <= 0) return;
      const s = f.headSize * bloom;
      const pal = f.palette;

      ctx.save();
      ctx.translate(cx, cy);

      // Лепестки по кругу.
      for (let i = 0; i < f.petalCount; i++) {
        const a = (i / f.petalCount) * Math.PI * 2;
        ctx.save();
        ctx.rotate(a);
        ctx.fillStyle = pal.petal;
        ctx.beginPath();
        if (pal.type === "sunflower") {
          ctx.ellipse(0, -s * 1.15, s * 0.32, s * 0.9, 0, 0, Math.PI * 2);
        } else if (pal.type === "daisy") {
          ctx.ellipse(0, -s * 1.0, s * 0.24, s * 0.75, 0, 0, Math.PI * 2);
        } else {
          ctx.ellipse(0, -s * 0.85, s * 0.55, s * 0.7, 0, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();
      }

      // Серединка цветка.
      ctx.fillStyle = pal.center;
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.42, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function draw(time) {
      if (startTime === null) startTime = time;
      const elapsed = time - startTime;

      ctx.clearRect(0, 0, w, h);

      // Тёплое свечение по центру-низу, как в референсе.
      const glow = ctx.createRadialGradient(
        w / 2, h * 0.72, 0,
        w / 2, h * 0.72, Math.max(w, h) * 0.5
      );
      glow.addColorStop(0, "rgba(120, 60, 40, 0.35)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      for (const f of flowers) {
        const localElapsed = elapsed - f.delay;
        if (localElapsed < 0) continue;

        const growRaw = Math.min(1, localElapsed / GROW_MS);
        const grow = easeOutCubic(growRaw);

        const sway = growRaw >= 1
          ? Math.sin(time * 0.001 * f.swaySpeed + f.swayPhase) * f.swayAmp
          : 0;

        const topX = f.x + f.tilt * f.stemHeight * grow + sway;
        const topY = f.groundY - f.stemHeight * grow;

        drawStem(f, growRaw, topX, topY);

        const bloomRaw = Math.min(1, Math.max(0, localElapsed - GROW_MS) / BLOOM_MS);
        const bloom = growRaw >= 1 ? easeOutBack(bloomRaw) : 0;

        drawHead(f, Math.max(0, bloom), topX, topY);
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
